replicaCount: 1
image:
  repository: ghcr.io/fitnest-backend/order-service
  tag: "latest"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
istio:
  enabled: true
  host: "order-service"
  mtls:
    mode: STRICT
  authorization:
    internalCallers:
      - "cluster.local/ns/fitnest-dev/sa/identity-service"
      - "cluster.local/ns/fitnest-dev/sa/marketplace-service"
      - "cluster.local/ns/fitnest-dev/sa/payment-service"
      - "cluster.local/ns/fitnest-dev/sa/api-gateway"
env:
  SPRING_PROFILES_ACTIVE: dev
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql-order.fitnest-dev.svc.cluster.local:5432/fitnest_order?sslmode=disable"
  SPRING_DATASOURCE_USERNAME: "fitnest_order"
  SPRING_DATASOURCE_PASSWORD: "order_password_123"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_REDIS_HOST: "redis.fitnest-dev.svc.cluster.local"
  SPRING_REDIS_PORT: "6379"
  SPRING_REDIS_PASSWORD: ""
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service.fitnest-dev.svc.cluster.local:9092"
  JWT_SECRET: "your-jwt-secret-change-in-production"
  JWT_ISSUER: "fitnest"
  IDENTITY_SERVICE_URL: "http://identity-service:8080"
  MARKETPLACE_SERVICE_URL: "http://marketplace-service:8080"
  PAYMENT_SERVICE_URL: "http://payment-service:8080"
  identity-service: "cluster.local/ns/fitnest-dev/sa/identity-service"
  marketplace-service: "cluster.local/ns/fitnest-dev/sa/marketplace-service"
  payment-service: "cluster.local/ns/fitnest-dev/sa/payment-service"
  api-gateway: "cluster.local/ns/fitnest-dev/sa/api-gateway"

livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

