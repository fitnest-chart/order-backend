replicaCount: 1
image:
  repository: ghcr.io/fitnest-backend/order-service
  tag: "development-f180168"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090
istio:
  enabled: true
  host: "order-service"
  mtls:
    mode: STRICT
  authorization:
    internalCallers:
      - "cluster.local/ns/fitnest-dev/sa/identity-service"
      - "cluster.local/ns/fitnest-dev/sa/catalog-service"
      - "cluster.local/ns/fitnest-dev/sa/payment-service"
      - "cluster.local/ns/fitnest-dev/sa/api-gateway"
hpa:
  enabled: false
  minReplicas: "1"
  maxReplicas: "3"
  cpuUtilization: "90"
  memoryUtilization: "450Mi"
env:
  SPRING_PROFILES_ACTIVE: dev
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql-order:5432/fitnest_order?sslmode=disable"
  SPRING_DATASOURCE_USERNAME: "fitnest_order"
  SPRING_DATASOURCE_PASSWORD: "order_password_123"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ""
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  JWT_SECRET: "your-jwt-secret-change-in-production"
  JWT_ISSUER: "fitnest"
  IDENTITY_SERVICE_URL: "http://identity-service:8080"
  CATALOG_SERVICE_URL: "http://catalog-service:8080"
  PAYMENT_SERVICE_URL: "http://payment-service:8080"
  identity-service: "cluster.local/ns/fitnest-dev/sa/identity-service"
  catalog-service: "cluster.local/ns/fitnest-dev/sa/catalog-service"
  payment-service: "cluster.local/ns/fitnest-dev/sa/payment-service"
  api-gateway: "cluster.local/ns/fitnest-dev/sa/api-gateway"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=50 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=192m -Xss512k -XX:+ExitOnOutOfMemoryError"
resources:
  limits:
    memory: 1024Mi
    cpu: 1000m
  requests:
    cpu: 500m
    memory: 700Mi
